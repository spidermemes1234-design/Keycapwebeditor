<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f38"/><stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb547"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e2510a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- keycap body (the skirt) -->
  <rect x="40" y="56" width="432" height="420" rx="96" fill="url(#base)"/>
  <rect x="40" y="56" width="432" height="420" rx="96" fill="none" stroke="#3d424d" stroke-width="6"/>
  <!-- top face -->
  <rect x="92" y="78" width="328" height="318" rx="68" fill="url(#top)"/>
  <rect x="92" y="78" width="328" height="318" rx="68" fill="url(#shine)"/>
  <rect x="92" y="78" width="328" height="318" rx="68" fill="none" stroke="#ffd08a" stroke-opacity=".6" stroke-width="4"/>
  <!-- K legend -->
  <path transform="translate(-34 0)" d="M196 150 h50 v74 l66-74 h60 l-80 86 86 102 h-62 l-70-86 v86 h-50 z" fill="#1a0d02"/>
</svg>
