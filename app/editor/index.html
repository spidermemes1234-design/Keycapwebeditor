<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keycap Web Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="top">
  <div class="brand">⌘ Keycap Web Editor <span id="ver"></span></div>
  <select id="pageSel" title="Page you're editing"></select>
  <div class="seg" id="mode"><button data-m="edit" class="on" title="Click to select, double-click text to edit">✏️ Edit</button><button data-m="test" title="Buttons and links work like the real site (Ctrl+Enter)">▶ Test</button></div>
  <span id="pasteHint" class="hidden" title="A block is copied. Ctrl+V to paste">📋</span>
  <div class="spacer"></div>
  <span id="status">Loading…</span>
  <button id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
  <button id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
  <div class="seg" id="device">
    <button data-w="100%" class="on" title="Desktop">🖥</button><button data-w="820px" title="Tablet">📱</button><button data-w="390px" title="Phone">📲</button>
  </div>
  <button id="menuBtn" title="More">⋯</button>
  <button class="primary" id="pubBtn">Publish</button>
  <div id="menu" class="pop hidden">
    <button data-act="draft">Publish a private test version…</button>
    <button data-act="login">Cloudflare login (once)</button>
    <button data-act="backup">Make a backup now</button>
    <button data-act="backups">Restore a backup…</button>
    <button data-act="site">Open keycapstudios.com</button>
    <button data-act="folder">Show where my site is saved</button>
    <button data-act="keys">Keyboard shortcuts</button>
  </div>
</header>
<main>
  <aside id="side">
    <nav id="tabs">
      <button data-tab="blocks" class="on">Blocks</button>
      <button data-tab="pages">Pages</button>
      <button data-tab="posts">Posts</button>
      <button data-tab="site">Site</button>
      <button data-tab="media">Media</button>
    </nav>
    <div id="panel"></div>
  </aside>
  <section id="stage">
    <div id="frameWrap"><iframe id="pv"></iframe></div>
  </section>
</main>

<div id="modal" class="hidden"><div class="box"><div class="mhead"><strong id="mtitle"></strong><button id="mclose">✕</button></div><div id="mbody"></div></div></div>
<div id="log" class="hidden"><div class="mhead"><strong>Publishing</strong><button onclick="this.closest('#log').classList.add('hidden')">✕</button></div><pre id="logtxt"></pre></div>
<div id="toast"></div>

<script src="schema.js"></script>
<script src="editor.js"></script>
</body>
</html>
